// pkg/plugin-sdk/proto/plugin.proto
// 插件通信契约（M3.3）：主进程（internal/plugin）与插件子进程（pkg/plugin-sdk/server）共用。
// 对齐 docs/architecture.md 6.2 三服务设计：
//   - PluginService：生命周期（Info/Activate/Deactivate）
//   - HookService：同步钩子执行（Execute；流式 Stream 后置）
//   - PluginAPI：插件自定义 API（主进程按 /api/plugins/{id}/** 代理）
//
// 生成方式：./scripts/gen-proto.sh（buf + protoc-gen-go/protoc-gen-go-grpc）
// 生成的 .pb.go 提交仓库，第三方插件作者无需安装工具链。
syntax = "proto3";

package yueyan.plugin.v1;

option go_package = "github.com/roberts9012062/boke/pkg/plugin-sdk/proto";

// ---------- 通用消息 ----------

// Empty 空请求（无参数 RPC）。
message Empty {}

// PluginInfo 插件信息（Info 返回，主进程校验插件声明与清单一致）。
message PluginInfo {
  string id = 1;                 // 插件 ID（唯一，与清单 id 一致）
  string name = 2;               // 插件名称
  string version = 3;            // 版本号
  string author = 4;             // 作者
  string description = 5;        // 一句话描述
  repeated string hooks = 6;     // 声明的钩子（对齐主进程钩子表，如 "post.after_publish"）
  repeated string apis = 7;      // 自定义 API 路径（如 "/ping"，主进程挂 /api/plugins/{id}/**）
  repeated SettingField settings = 8; // 设置项声明（设置页 schema 驱动；主进程聚合「进程上报优先、市场清单兜底」）
  repeated string capabilities = 9;   // 能力声明（授权模型：hooks/api/frontend/settings 基础 + data.read 扩展）
}

// SettingField 插件设置项声明（设置页 schema 驱动通用渲染器）。
message SettingField {
  string key = 1;                // 设置键（存 plugin_instances.config：config["{key}"]）
  string label = 2;              // 展示标签
  string type = 3;               // 控件类型：text / switch / select
  string default = 4;            // 默认值
  repeated string options = 5;   // select 选项列表
}

// ConfigInfo 插件配置（主进程 → 插件：启动激活时下发 + 保存配置时推送）。
message ConfigInfo {
  map<string, string> values = 1; // 配置键值对（仅 schema 声明的 key）
}

// Status 激活/停用结果。
message Status {
  bool ok = 1;                   // 是否成功
  string error = 2;              // 错误信息（ok=false 时）
}

// ---------- 钩子 ----------

// HookRequest 钩子执行请求（主进程 → 插件；payload 为 JSON bytes）。
message HookRequest {
  string hook = 1;               // 钩子名（对齐主进程钩子常量）
  string trace_id = 2;           // 请求追踪 ID（贯穿日志）
  int64 actor_id = 3;            // 操作者用户 ID（0=匿名/系统）
  bytes payload = 4;             // 载荷 JSON（各钩子自定义结构，主进程传值副本）
}

// HookResponse 钩子执行响应。
//   - ok=false：同步拦截钩子拒绝（reason 为用户可读原因，阻断核心流程）
//   - modify：可改写钩子（search.query）返回改写后的载荷 JSON
message HookResponse {
  bool ok = 1;                   // 是否放行（false=拒绝）
  string reason = 2;             // 拒绝原因（用户可读）
  bytes modify = 3;              // 改写结果 JSON（可空）
  string error = 4;              // 插件内部错误（主进程记录 last_error，不阻断核心）
}

// ---------- 自定义 API ----------

// APICall 插件自定义 API 调用（主进程代理转发）。
message APICall {
  string method = 1;             // HTTP 方法（GET/POST/PUT/DELETE...）
  string path = 2;               // 路径（如 "/ping"）
  bytes body = 3;                // 请求体 JSON（可空）
}

// APICallResult 插件 API 响应。
message APICallResult {
  int32 status = 1;              // HTTP 状态码（200 正常）
  bytes body = 2;                // 响应体 JSON
  string error = 3;              // 插件内部错误（非 HTTP 错误）
}

// ---------- 许可证 ----------

// LicenseInfo 许可证信息（M3.5：主进程激活时下发，插件只读；主进程是唯一数据源）。
message LicenseInfo {
  string edition = 1;              // 版本：free（demo）/ pro（已激活）
  repeated string features = 2;    // 授权功能列表（FeatureEnabled 判断依据）
  int64 expires_at = 3;            // 到期时间戳（Unix 秒；0=永久）
  bool degraded = 4;               // 已降级（超宽限期未续费，功能锁定）
}

// ---------- 数据服务（插件经 GRPCBroker 调用主进程只读数据，M3.8 能力授权） ----------

// UserRequest 用户查询请求。
message UserRequest {
  int64 user_id = 1;             // 用户 ID
}

// UserInfo 用户信息（脱敏：不含邮箱/手机/密码等敏感字段）。
message UserInfo {
  int64 id = 1;                  // 用户 ID
  string nickname = 2;           // 昵称
  string avatar_url = 3;         // 头像 URL
  string role = 4;               // 角色（superadmin/admin/author/visitor）
  string bio = 5;                // 个人简介
}

// PostRequest 帖子查询请求。
message PostRequest {
  int64 post_id = 1;             // 帖子 ID
}

// PostInfo 帖子信息（脱敏：不含正文全文等敏感内容）。
message PostInfo {
  int64 id = 1;                  // 帖子 ID
  string title = 2;              // 标题
  string status = 3;             // 状态（published/draft/private/...）
  int64 author_id = 4;           // 作者 ID
  string author_name = 5;        // 作者昵称
}

// SettingsSnapshot 站点设置快照（主进程仅下发白名单公开键，不含密钥类敏感键）。
message SettingsSnapshot {
  map<string, string> values = 1; // 白名单键值对
}

// DataService 主进程只读数据服务（插件声明 data.read 能力并经 broker 获取连接）。
service DataService {
  // GetUser 查询用户脱敏信息。
  rpc GetUser(UserRequest) returns (UserInfo);
  // GetPost 查询帖子脱敏信息。
  rpc GetPost(PostRequest) returns (PostInfo);
  // GetSettings 查询站点公开设置（白名单键）。
  rpc GetSettings(Empty) returns (SettingsSnapshot);
}

// ---------- 服务 ----------

// PluginService 插件生命周期服务。
service PluginService {
  // Info 返回插件信息（启用时校验声明与安装清单一致）。
  rpc Info(Empty) returns (PluginInfo);
  // Activate 激活（携带许可证信息与数据服务 broker ID；插件侧更新内存并初始化资源）。
  rpc Activate(ActivateRequest) returns (Status);
  // Deactivate 停用（停用回调，插件侧保存状态/释放资源）。
  rpc Deactivate(Empty) returns (Status);
  // SetConfig 下发配置（启动激活后 + 保存配置时推送；插件侧更新内存，handler 经 sdk.Config 读取）。
  rpc SetConfig(ConfigInfo) returns (Status);
}

// ActivateRequest 激活请求（M3.8：许可证 + 数据服务 broker ID 一次性下发）。
message ActivateRequest {
  LicenseInfo license = 1;       // 许可证信息（M3.5）
  int64 data_broker_id = 2;      // 主进程数据服务 broker ID（0=未授权/未提供；仅声明 data.read 能力时下发）
}

// HookService 钩子执行服务。
service HookService {
  // Execute 同步钩子执行（可拦截/改写；异步钩子由主进程后台调用）。
  rpc Execute(HookRequest) returns (HookResponse);
  // Stream 流式钩子通道（M3.9 client-streaming：主进程建立长期连接持续推送异步事件；
  // 插件侧 recv 循环分发到异步钩子 handler；断连由进程重启重建——stream 不可用回退 Execute）。
  rpc Stream(stream StreamEvent) returns (Empty);
}

// StreamEvent 流式事件（主进程 → 插件：异步钩子推送，与 HookRequest 同构）。
message StreamEvent {
  string hook = 1;               // 钩子名（异步钩子：post.after_publish/comment.after_save/notification.send/...）
  string trace_id = 2;           // 请求追踪 ID（贯穿日志）
  int64 actor_id = 3;            // 操作者用户 ID（0=匿名/系统）
  bytes payload = 4;             // 载荷 JSON（各钩子自定义结构）
}

// PluginAPI 插件自定义 API 服务（主进程按前缀路由代理）。
service PluginAPI {
  // Call 分发插件自定义 API 调用。
  rpc Call(APICall) returns (APICallResult);
}
