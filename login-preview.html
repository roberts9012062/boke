<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="登录页"
      class="box-border w-[1200px] h-[800px] bg-[#F5F7FA] overflow-hidden relative"
    >
      <div
        data-pencil-name="登录卡片"
        class="box-border w-[400px] h-[360px] absolute left-[400px] top-[220px] bg-[#FFFFFF] [outline:1px_solid_#E5E7EB] [outline-offset:-0.5px] rounded-[16px] [z-index:0]"
      >
        <div
          data-pencil-name="标题"
          class="text-[28px]/[normal] box-border w-[400px] absolute left-0 top-[36px] text-[#111827] font-[Inter,system-ui,sans-serif] font-bold text-center [z-index:0]"
        >
          登录
        </div>
        <div
          data-pencil-name="邮箱标签"
          class="text-[14px]/[normal] box-border absolute left-[40px] top-[100px] text-[#374151] font-[Inter,system-ui,sans-serif] font-medium text-left [white-space:nowrap] [z-index:1]"
        >
          邮箱
        </div>
        <div
          data-pencil-name="邮箱输入框"
          class="box-border w-[320px] h-[46px] absolute left-[40px] top-[126px] bg-[#F9FAFB] [outline:1px_solid_#D1D5DB] [outline-offset:-0.5px] rounded-[8px] [z-index:2]"
        >
          <div
            data-pencil-name="邮箱占位文本"
            class="text-[14px]/[normal] box-border absolute left-[14px] top-[13px] text-[#9CA3AF] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap] [z-index:0]"
          >
            请输入邮箱
          </div>
        </div>
        <div
          data-pencil-name="密码标签"
          class="text-[14px]/[normal] box-border absolute left-[40px] top-[190px] text-[#374151] font-[Inter,system-ui,sans-serif] font-medium text-left [white-space:nowrap] [z-index:3]"
        >
          密码
        </div>
        <div
          data-pencil-name="密码输入框"
          class="box-border w-[320px] h-[46px] absolute left-[40px] top-[216px] bg-[#F9FAFB] [outline:1px_solid_#D1D5DB] [outline-offset:-0.5px] rounded-[8px] [z-index:4]"
        >
          <div
            data-pencil-name="密码占位文本"
            class="text-[14px]/[normal] box-border absolute left-[14px] top-[13px] text-[#9CA3AF] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap] [z-index:0]"
          >
            请输入密码
          </div>
        </div>
        <div
          data-pencil-name="登录按钮"
          class="box-border w-[320px] h-[48px] absolute left-[40px] top-[280px] bg-[#4F46E5] rounded-[8px] [z-index:5]"
        >
          <div
            data-pencil-name="按钮文本"
            class="text-[16px]/[normal] box-border w-[320px] absolute left-0 top-[13px] text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-semibold text-center [z-index:0]"
          >
            登录
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
